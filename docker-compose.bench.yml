# ARTEX Tencent TSec Benchmark evaluation image -- one-command local build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in foreground (see logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # run in background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also delete the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host's network: the container uses the host network stack directly and can reach target networks on the host/VPN.
    # In host mode no ports mapping is used; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and the internal PostgreSQL 5432 -- make sure these three host ports are free (stop any services using them before testing locally).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
